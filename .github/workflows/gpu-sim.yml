name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the HIP kernels for gfx90a and runs the ctest suite on a simulated AMD
# Instinct MI250X (https://github.com/pantheongpu/pantheonsim). A simulator
# cannot reproduce hardware-specific behavior or timing, so it complements
# real-GPU testing and does not replace it.

on:
  push:
    branches: [ verify-gpu-sim ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ctest:
    name: ctest (ROCm 7.1 and simulated MI250X)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and ROCm
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: amd/mi250x
          cuda-toolkit: none
          rocm: "7.1"

      - name: Install Boost headers and comgr
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev comgr

      - name: Diagnose find_package(hip)
        continue-on-error: true
        run: |
          dpkg -l | grep -E "^ii  (hip|comgr|hsa|rocm|rocprof)" | awk "{print \$2, \$3}"
          ls /opt/rocm/lib/cmake || true
          mkdir /tmp/d && printf 'cmake_minimum_required(VERSION 3.21)\nproject(d CXX)\nlist(APPEND CMAKE_PREFIX_PATH /opt/rocm)\nfind_package(hip REQUIRED)\n' > /tmp/d/CMakeLists.txt
          cmake -S /tmp/d -B /tmp/d/b || true
          apt-cache search -n 'comgr|rocprofiler-register|rocm-cmake' | head

      # CMakeLists.txt pins HIP_ARCHITECTURES to gfx90a (MI250X). The explicit
      # CMAKE_HIP_ARCHITECTURES keeps CMake from probing for a GPU.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRNS_ENABLE_GPU=ON \
            -DCMAKE_HIP_ARCHITECTURES=gfx90a

      # Without HIP, CMake silently falls back to a CPU-only build.
      - name: Check the GPU test is registered
        run: ctest --test-dir build -N | grep test_gemm_mod

      - name: Build
        run: cmake --build build -j3

      - name: Test
        run: vgpu run ctest --test-dir build --output-on-failure --no-tests=error
